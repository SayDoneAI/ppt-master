<svg xmlns="http://www.w3.org/2000/svg" width="1242" height="1660" viewBox="0 0 1242 1660">
  <!-- 暖白背景 -->
  <rect width="1242" height="1660" fill="#F5F0E1"/>

  <!-- 顶部标题 -->
  <text x="621" y="130" text-anchor="middle" font-family="Arial, 'Helvetica Neue', 'Microsoft YaHei', sans-serif" font-size="52" font-weight="bold" fill="#3D3028">{{TITLE}}</text>
  <text x="621" y="180" text-anchor="middle" font-family="Arial, 'Helvetica Neue', 'Microsoft YaHei', sans-serif" font-size="26" fill="#8B7355">{{SUBTITLE}}</text>

  <!-- 装饰线 -->
  <rect x="571" y="206" width="100" height="3" rx="1" fill="#C67B5C"/>

  <!-- 特点标签行 -->
  <rect x="330" y="240" width="140" height="40" rx="20" fill="#C67B5C" fill-opacity="0.12"/>
  <text x="400" y="267" text-anchor="middle" font-family="Arial, 'Helvetica Neue', 'Microsoft YaHei', sans-serif" font-size="18" fill="#C67B5C">自然成分</text>
  <rect x="490" y="240" width="140" height="40" rx="20" fill="#6B7B3C" fill-opacity="0.12"/>
  <text x="560" y="267" text-anchor="middle" font-family="Arial, 'Helvetica Neue', 'Microsoft YaHei', sans-serif" font-size="18" fill="#6B7B3C">温和配方</text>
  <rect x="650" y="240" width="140" height="40" rx="20" fill="#C67B5C" fill-opacity="0.12"/>
  <text x="720" y="267" text-anchor="middle" font-family="Arial, 'Helvetica Neue', 'Microsoft YaHei', sans-serif" font-size="18" fill="#C67B5C">高性价比</text>

  <!-- 简短描述 -->
  <text x="621" y="340" text-anchor="middle" font-family="Arial, 'Helvetica Neue', 'Microsoft YaHei', sans-serif" font-size="24" fill="#8B7355">{{BODY}}</text>
  <text x="621" y="380" text-anchor="middle" font-family="Arial, 'Helvetica Neue', 'Microsoft YaHei', sans-serif" font-size="24" fill="#8B7355">用过都说好，回购率超高</text>

  <!-- 底部大图区 -->
  <rect x="60" y="430" width="1122" height="1020" rx="24" fill="#D4C4A8" fill-opacity="0.4"/>
  <text x="621" y="950" text-anchor="middle" font-family="Arial, 'Helvetica Neue', 'Microsoft YaHei', sans-serif" font-size="32" fill="#8B7355">{{IMAGE}}</text>

  <!-- CTA -->
  <rect x="371" y="1500" width="500" height="60" rx="30" fill="#6B7B3C"/>
  <text x="621" y="1540" text-anchor="middle" font-family="Arial, 'Helvetica Neue', 'Microsoft YaHei', sans-serif" font-size="26" font-weight="bold" fill="#FFFFFF">{{CTA}}</text>

  <!-- 底部 -->
  <text x="60" y="1620" font-family="Arial, 'Helvetica Neue', 'Microsoft YaHei', sans-serif" font-size="20" fill="#8B7355">{{AUTHOR}}</text>
  <text x="1182" y="1620" text-anchor="end" font-family="Arial, 'Helvetica Neue', 'Microsoft YaHei', sans-serif" font-size="20" fill="#D4C4A8">{{DATE}}</text>
</svg>
