<svg xmlns="http://www.w3.org/2000/svg" width="1242" height="1660" viewBox="0 0 1242 1660">
  <!-- 暖白背景 -->
  <rect width="1242" height="1660" fill="#F5F0E1"/>

  <!-- 顶部装饰弧线 -->
  <ellipse cx="621" cy="0" rx="700" ry="120" fill="#C67B5C" fill-opacity="0.08"/>

  <!-- 标题区 -->
  <text x="621" y="130" text-anchor="middle" font-family="Arial, 'Helvetica Neue', 'Microsoft YaHei', sans-serif" font-size="52" font-weight="bold" fill="#3D3028">{{TITLE}}</text>
  <text x="621" y="180" text-anchor="middle" font-family="Arial, 'Helvetica Neue', 'Microsoft YaHei', sans-serif" font-size="28" fill="#8B7355">{{SUBTITLE}}</text>

  <!-- 主图区 -->
  <rect x="60" y="220" width="1122" height="520" rx="24" fill="#D4C4A8" fill-opacity="0.4"/>
  <text x="621" y="490" text-anchor="middle" font-family="Arial, 'Helvetica Neue', 'Microsoft YaHei', sans-serif" font-size="28" fill="#8B7355">{{IMAGE}}</text>

  <!-- 特点卡片 -->
  <rect x="60" y="780" width="541" height="240" rx="20" fill="#FFFFFF"/>
  <rect x="80" y="800" width="8" height="40" rx="4" fill="#C67B5C"/>
  <text x="108" y="830" font-family="Arial, 'Helvetica Neue', 'Microsoft YaHei', sans-serif" font-size="26" font-weight="bold" fill="#3D3028">亮点一</text>
  <text x="80" y="880" font-family="Arial, 'Helvetica Neue', 'Microsoft YaHei', sans-serif" font-size="22" fill="#8B7355">产品特色描述文字，</text>
  <text x="80" y="915" font-family="Arial, 'Helvetica Neue', 'Microsoft YaHei', sans-serif" font-size="22" fill="#8B7355">突出核心卖点</text>

  <rect x="621" y="780" width="561" height="240" rx="20" fill="#FFFFFF"/>
  <rect x="641" y="800" width="8" height="40" rx="4" fill="#6B7B3C"/>
  <text x="669" y="830" font-family="Arial, 'Helvetica Neue', 'Microsoft YaHei', sans-serif" font-size="26" font-weight="bold" fill="#3D3028">亮点二</text>
  <text x="641" y="880" font-family="Arial, 'Helvetica Neue', 'Microsoft YaHei', sans-serif" font-size="22" fill="#8B7355">产品使用体验，</text>
  <text x="641" y="915" font-family="Arial, 'Helvetica Neue', 'Microsoft YaHei', sans-serif" font-size="22" fill="#8B7355">真实感受分享</text>

  <rect x="60" y="1040" width="1122" height="200" rx="20" fill="#FFFFFF"/>
  <rect x="80" y="1060" width="8" height="40" rx="4" fill="#C67B5C"/>
  <text x="108" y="1090" font-family="Arial, 'Helvetica Neue', 'Microsoft YaHei', sans-serif" font-size="26" font-weight="bold" fill="#3D3028">使用心得</text>
  <text x="80" y="1140" font-family="Arial, 'Helvetica Neue', 'Microsoft YaHei', sans-serif" font-size="22" fill="#8B7355">{{BODY}}</text>
  <text x="80" y="1180" font-family="Arial, 'Helvetica Neue', 'Microsoft YaHei', sans-serif" font-size="22" fill="#8B7355">详细的使用感受和推荐理由</text>

  <!-- 标签区 -->
  <rect x="60" y="1300" width="120" height="40" rx="20" fill="#C67B5C" fill-opacity="0.15"/>
  <text x="120" y="1328" text-anchor="middle" font-family="Arial, 'Helvetica Neue', 'Microsoft YaHei', sans-serif" font-size="18" fill="#C67B5C">#好物</text>
  <rect x="200" y="1300" width="120" height="40" rx="20" fill="#6B7B3C" fill-opacity="0.15"/>
  <text x="260" y="1328" text-anchor="middle" font-family="Arial, 'Helvetica Neue', 'Microsoft YaHei', sans-serif" font-size="18" fill="#6B7B3C">#推荐</text>
  <rect x="340" y="1300" width="120" height="40" rx="20" fill="#C67B5C" fill-opacity="0.15"/>
  <text x="400" y="1328" text-anchor="middle" font-family="Arial, 'Helvetica Neue', 'Microsoft YaHei', sans-serif" font-size="18" fill="#C67B5C">#种草</text>

  <!-- CTA -->
  <rect x="371" y="1400" width="500" height="60" rx="30" fill="#6B7B3C"/>
  <text x="621" y="1440" text-anchor="middle" font-family="Arial, 'Helvetica Neue', 'Microsoft YaHei', sans-serif" font-size="26" font-weight="bold" fill="#FFFFFF">{{CTA}}</text>

  <!-- 底部 -->
  <rect x="60" y="1540" width="1122" height="1" fill="#D4C4A8"/>
  <text x="60" y="1580" font-family="Arial, 'Helvetica Neue', 'Microsoft YaHei', sans-serif" font-size="20" fill="#8B7355">{{AUTHOR}}</text>
  <text x="1182" y="1580" text-anchor="end" font-family="Arial, 'Helvetica Neue', 'Microsoft YaHei', sans-serif" font-size="20" fill="#D4C4A8">{{DATE}}</text>
</svg>
