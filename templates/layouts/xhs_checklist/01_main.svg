<svg xmlns="http://www.w3.org/2000/svg" width="1242" height="1660" viewBox="0 0 1242 1660">
  <!-- 白色背景 -->
  <rect width="1242" height="1660" fill="#FFFFFF"/>

  <!-- 顶部红色标签 -->
  <rect x="60" y="60" width="180" height="48" rx="8" fill="#E53935"/>
  <text x="150" y="92" text-anchor="middle" font-family="Arial, 'Helvetica Neue', 'Microsoft YaHei', sans-serif" font-size="24" font-weight="bold" fill="#FFFFFF">{{TAG}}</text>

  <!-- 大标题（两行） -->
  <text x="60" y="180" font-family="Arial, 'Helvetica Neue', 'Microsoft YaHei', sans-serif" font-size="64" font-weight="bold" fill="#1A1A1A">{{TITLE_LINE1}}</text>
  <text x="60" y="260" font-family="Arial, 'Helvetica Neue', 'Microsoft YaHei', sans-serif" font-size="64" font-weight="bold" fill="#1A1A1A">{{TITLE_LINE2}}</text>

  <!-- 标题关键词高亮背景（示例） -->
  <rect x="316" y="218" width="260" height="56" rx="4" fill="#E53935"/>
  <text x="446" y="258" text-anchor="middle" font-family="Arial, 'Helvetica Neue', 'Microsoft YaHei', sans-serif" font-size="64" font-weight="bold" fill="#FFFFFF">{{KEYWORD}}</text>

  <!-- 副标题说明 -->
  <text x="60" y="330" font-family="Arial, 'Helvetica Neue', 'Microsoft YaHei', sans-serif" font-size="28" fill="#666666">{{SUBTITLE}}</text>

  <!-- 分割线 -->
  <rect x="60" y="370" width="1122" height="2" fill="#EEEEEE"/>

  <!-- 区块A：标签 -->
  <rect x="60" y="410" width="160" height="44" rx="8" fill="#E53935"/>
  <text x="140" y="440" text-anchor="middle" font-family="Arial, 'Helvetica Neue', 'Microsoft YaHei', sans-serif" font-size="24" font-weight="bold" fill="#FFFFFF">{{SECTION_A}}</text>

  <!-- 区块A 条目 -->
  <text x="100" y="500" font-family="Arial, 'Helvetica Neue', 'Microsoft YaHei', sans-serif" font-size="28" fill="#E53935" font-weight="bold">1.</text>
  <text x="140" y="500" font-family="Arial, 'Helvetica Neue', 'Microsoft YaHei', sans-serif" font-size="28" fill="#333333">{{A_ITEM_1}}</text>
  <text x="100" y="550" font-family="Arial, 'Helvetica Neue', 'Microsoft YaHei', sans-serif" font-size="28" fill="#E53935" font-weight="bold">2.</text>
  <text x="140" y="550" font-family="Arial, 'Helvetica Neue', 'Microsoft YaHei', sans-serif" font-size="28" fill="#333333">{{A_ITEM_2}}</text>
  <text x="100" y="600" font-family="Arial, 'Helvetica Neue', 'Microsoft YaHei', sans-serif" font-size="28" fill="#E53935" font-weight="bold">3.</text>
  <text x="140" y="600" font-family="Arial, 'Helvetica Neue', 'Microsoft YaHei', sans-serif" font-size="28" fill="#333333">{{A_ITEM_3}}</text>
  <text x="100" y="650" font-family="Arial, 'Helvetica Neue', 'Microsoft YaHei', sans-serif" font-size="28" fill="#E53935" font-weight="bold">4.</text>
  <text x="140" y="650" font-family="Arial, 'Helvetica Neue', 'Microsoft YaHei', sans-serif" font-size="28" fill="#333333">{{A_ITEM_4}}</text>
  <text x="100" y="700" font-family="Arial, 'Helvetica Neue', 'Microsoft YaHei', sans-serif" font-size="28" fill="#E53935" font-weight="bold">5.</text>
  <text x="140" y="700" font-family="Arial, 'Helvetica Neue', 'Microsoft YaHei', sans-serif" font-size="28" fill="#333333">{{A_ITEM_5}}</text>
  <text x="100" y="750" font-family="Arial, 'Helvetica Neue', 'Microsoft YaHei', sans-serif" font-size="28" fill="#E53935" font-weight="bold">6.</text>
  <text x="140" y="750" font-family="Arial, 'Helvetica Neue', 'Microsoft YaHei', sans-serif" font-size="28" fill="#333333">{{A_ITEM_6}}</text>

  <!-- 分割线 -->
  <rect x="60" y="790" width="1122" height="1" fill="#EEEEEE"/>

  <!-- 区块B：标签 -->
  <rect x="60" y="820" width="160" height="44" rx="8" fill="#43A047"/>
  <text x="140" y="850" text-anchor="middle" font-family="Arial, 'Helvetica Neue', 'Microsoft YaHei', sans-serif" font-size="24" font-weight="bold" fill="#FFFFFF">{{SECTION_B}}</text>

  <!-- 区块B 条目 -->
  <text x="100" y="910" font-family="Arial, 'Helvetica Neue', 'Microsoft YaHei', sans-serif" font-size="28" fill="#43A047" font-weight="bold">1.</text>
  <text x="140" y="910" font-family="Arial, 'Helvetica Neue', 'Microsoft YaHei', sans-serif" font-size="28" fill="#333333">{{B_ITEM_1}}</text>
  <text x="100" y="960" font-family="Arial, 'Helvetica Neue', 'Microsoft YaHei', sans-serif" font-size="28" fill="#43A047" font-weight="bold">2.</text>
  <text x="140" y="960" font-family="Arial, 'Helvetica Neue', 'Microsoft YaHei', sans-serif" font-size="28" fill="#333333">{{B_ITEM_2}}</text>
  <text x="100" y="1010" font-family="Arial, 'Helvetica Neue', 'Microsoft YaHei', sans-serif" font-size="28" fill="#43A047" font-weight="bold">3.</text>
  <text x="140" y="1010" font-family="Arial, 'Helvetica Neue', 'Microsoft YaHei', sans-serif" font-size="28" fill="#333333">{{B_ITEM_3}}</text>
  <text x="100" y="1060" font-family="Arial, 'Helvetica Neue', 'Microsoft YaHei', sans-serif" font-size="28" fill="#43A047" font-weight="bold">4.</text>
  <text x="140" y="1060" font-family="Arial, 'Helvetica Neue', 'Microsoft YaHei', sans-serif" font-size="28" fill="#333333">{{B_ITEM_4}}</text>
  <text x="100" y="1110" font-family="Arial, 'Helvetica Neue', 'Microsoft YaHei', sans-serif" font-size="28" fill="#43A047" font-weight="bold">5.</text>
  <text x="140" y="1110" font-family="Arial, 'Helvetica Neue', 'Microsoft YaHei', sans-serif" font-size="28" fill="#333333">{{B_ITEM_5}}</text>

  <!-- 分割线 -->
  <rect x="60" y="1150" width="1122" height="1" fill="#EEEEEE"/>

  <!-- 区块C：标签 -->
  <rect x="60" y="1180" width="200" height="44" rx="8" fill="#1565C0"/>
  <text x="160" y="1210" text-anchor="middle" font-family="Arial, 'Helvetica Neue', 'Microsoft YaHei', sans-serif" font-size="24" font-weight="bold" fill="#FFFFFF">{{SECTION_C}}</text>

  <!-- 区块C 条目 -->
  <text x="100" y="1270" font-family="Arial, 'Helvetica Neue', 'Microsoft YaHei', sans-serif" font-size="28" fill="#1565C0" font-weight="bold">1.</text>
  <text x="140" y="1270" font-family="Arial, 'Helvetica Neue', 'Microsoft YaHei', sans-serif" font-size="28" fill="#333333">{{C_ITEM_1}}</text>
  <text x="100" y="1320" font-family="Arial, 'Helvetica Neue', 'Microsoft YaHei', sans-serif" font-size="28" fill="#1565C0" font-weight="bold">2.</text>
  <text x="140" y="1320" font-family="Arial, 'Helvetica Neue', 'Microsoft YaHei', sans-serif" font-size="28" fill="#333333">{{C_ITEM_2}}</text>
  <text x="100" y="1370" font-family="Arial, 'Helvetica Neue', 'Microsoft YaHei', sans-serif" font-size="28" fill="#1565C0" font-weight="bold">3.</text>
  <text x="140" y="1370" font-family="Arial, 'Helvetica Neue', 'Microsoft YaHei', sans-serif" font-size="28" fill="#333333">{{C_ITEM_3}}</text>

  <!-- 底部分割线 -->
  <rect x="60" y="1540" width="1122" height="1" fill="#EEEEEE"/>

  <!-- 底部信息 -->
  <text x="60" y="1580" font-family="Arial, 'Helvetica Neue', 'Microsoft YaHei', sans-serif" font-size="22" fill="#999999">{{AUTHOR}}</text>
  <text x="1182" y="1580" text-anchor="end" font-family="Arial, 'Helvetica Neue', 'Microsoft YaHei', sans-serif" font-size="22" fill="#CCCCCC">收藏 = 不亏</text>

  <!-- 底部红色装饰条 -->
  <rect x="0" y="1640" width="1242" height="20" fill="#E53935"/>
</svg>
