<svg xmlns="http://www.w3.org/2000/svg" width="900" height="383" viewBox="0 0 900 383">
  <!-- 背景 -->
  <rect width="900" height="383" fill="#F5F5F7"/>

  <!-- 左侧蓝色装饰区 -->
  <rect x="0" y="0" width="8" height="383" fill="#0078D7"/>

  <!-- 右侧图标区域 -->
  <rect x="620" y="40" width="240" height="303" rx="12" fill="#0078D7" fill-opacity="0.06"/>
  <text x="740" y="200" text-anchor="middle" font-family="Arial, 'Helvetica Neue', 'Microsoft YaHei', sans-serif" font-size="20" fill="#0078D7" fill-opacity="0.4">{{IMAGE}}</text>

  <!-- 标题 -->
  <text x="50" y="140" font-family="Arial, 'Helvetica Neue', 'Microsoft YaHei', sans-serif" font-size="42" font-weight="bold" fill="#333333">{{TITLE}}</text>

  <!-- 副标题 -->
  <text x="50" y="190" font-family="Arial, 'Helvetica Neue', 'Microsoft YaHei', sans-serif" font-size="20" fill="#666666">{{SUBTITLE}}</text>

  <!-- 装饰标签 -->
  <rect x="50" y="240" width="100" height="32" rx="4" fill="#0078D7"/>
  <text x="100" y="262" text-anchor="middle" font-family="Arial, 'Helvetica Neue', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF">技术</text>
  <rect x="165" y="240" width="100" height="32" rx="4" fill="#00A4EF"/>
  <text x="215" y="262" text-anchor="middle" font-family="Arial, 'Helvetica Neue', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF">深度</text>

  <!-- 底部分割线+公众号名 -->
  <rect x="50" y="320" width="500" height="1" fill="#E0E0E0"/>
  <text x="50" y="352" font-family="Arial, 'Helvetica Neue', 'Microsoft YaHei', sans-serif" font-size="16" fill="#999999">{{AUTHOR}}</text>
  <text x="850" y="352" text-anchor="end" font-family="Arial, 'Helvetica Neue', 'Microsoft YaHei', sans-serif" font-size="14" fill="#CCCCCC">{{DATE}}</text>
</svg>
