<svg xmlns="http://www.w3.org/2000/svg" width="900" height="383" viewBox="0 0 900 383">
  <!-- 深色科技风背景 -->
  <rect width="900" height="383" fill="#1A1A2E"/>

  <!-- 装饰网格点 -->
  <circle cx="800" cy="60" r="3" fill="#0078D7" fill-opacity="0.3"/>
  <circle cx="830" cy="90" r="3" fill="#00A4EF" fill-opacity="0.3"/>
  <circle cx="860" cy="60" r="3" fill="#0078D7" fill-opacity="0.3"/>
  <circle cx="800" cy="120" r="3" fill="#00A4EF" fill-opacity="0.2"/>
  <circle cx="830" cy="150" r="3" fill="#0078D7" fill-opacity="0.2"/>

  <!-- 左侧发光装饰线 -->
  <rect x="50" y="100" width="4" height="80" rx="2" fill="#0078D7"/>
  <rect x="50" y="200" width="4" height="40" rx="2" fill="#00A4EF"/>

  <!-- 标题 -->
  <text x="80" y="155" font-family="Arial, 'Helvetica Neue', 'Microsoft YaHei', sans-serif" font-size="40" font-weight="bold" fill="#FFFFFF">{{TITLE}}</text>
  <text x="80" y="200" font-family="Arial, 'Helvetica Neue', 'Microsoft YaHei', sans-serif" font-size="20" fill="#FFFFFF" fill-opacity="0.6">{{SUBTITLE}}</text>

  <!-- 标签 -->
  <rect x="80" y="250" width="80" height="28" rx="14" fill="#0078D7" fill-opacity="0.2" stroke="#0078D7" stroke-opacity="0.4" stroke-width="1"/>
  <text x="120" y="270" text-anchor="middle" font-family="Arial, 'Helvetica Neue', 'Microsoft YaHei', sans-serif" font-size="13" fill="#00A4EF">深度</text>

  <!-- 底部 -->
  <rect x="80" y="330" width="400" height="1" fill="#FFFFFF" fill-opacity="0.1"/>
  <text x="80" y="360" font-family="Arial, 'Helvetica Neue', 'Microsoft YaHei', sans-serif" font-size="14" fill="#FFFFFF" fill-opacity="0.4">{{AUTHOR}}</text>
</svg>
