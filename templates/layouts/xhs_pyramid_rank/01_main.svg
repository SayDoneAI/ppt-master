<svg xmlns="http://www.w3.org/2000/svg" width="1242" height="1660" viewBox="0 0 1242 1660">
  <!-- 浅灰背景 -->
  <rect width="1242" height="1660" fill="#F5F5F5"/>

  <!-- 标题 -->
  <text x="621" y="120" text-anchor="middle" font-family="Arial, 'Helvetica Neue', 'Microsoft YaHei', sans-serif" font-size="52" font-weight="bold" fill="#1A1A1A">{{TITLE_LINE1}}</text>
  <text x="621" y="190" text-anchor="middle" font-family="Arial, 'Helvetica Neue', 'Microsoft YaHei', sans-serif" font-size="52" font-weight="bold" fill="#1A1A1A">{{TITLE_LINE2}}</text>

  <!-- 装饰线 -->
  <rect x="521" y="220" width="200" height="4" rx="2" fill="#E53935"/>

  <!-- 左侧标签列 -->
  <text x="120" y="350" text-anchor="end" font-family="Arial, 'Helvetica Neue', 'Microsoft YaHei', sans-serif" font-size="24" font-weight="bold" fill="#666666">{{LABEL_COL_LEFT}}</text>
  <text x="1000" y="350" text-anchor="start" font-family="Arial, 'Helvetica Neue', 'Microsoft YaHei', sans-serif" font-size="24" font-weight="bold" fill="#666666">{{LABEL_COL_RIGHT}}</text>

  <!-- 金字塔 — 第1层（顶部，最窄） -->
  <polygon points="621,400 741,520 501,520" fill="#E53935"/>
  <text x="621" y="485" text-anchor="middle" font-family="Arial, 'Helvetica Neue', 'Microsoft YaHei', sans-serif" font-size="28" font-weight="bold" fill="#FFFFFF">{{RANK_1}}</text>
  <text x="460" y="475" text-anchor="end" font-family="Arial, 'Helvetica Neue', 'Microsoft YaHei', sans-serif" font-size="24" fill="#333333">{{RANK_1_LEFT}}</text>
  <text x="780" y="475" font-family="Arial, 'Helvetica Neue', 'Microsoft YaHei', sans-serif" font-size="24" fill="#E53935" font-weight="bold">{{RANK_1_RIGHT}}</text>

  <!-- 金字塔 — 第2层 -->
  <polygon points="501,530 741,530 801,650 441,650" fill="#FF5722"/>
  <text x="621" y="605" text-anchor="middle" font-family="Arial, 'Helvetica Neue', 'Microsoft YaHei', sans-serif" font-size="28" font-weight="bold" fill="#FFFFFF">{{RANK_2}}</text>
  <text x="400" y="600" text-anchor="end" font-family="Arial, 'Helvetica Neue', 'Microsoft YaHei', sans-serif" font-size="24" fill="#333333">{{RANK_2_LEFT}}</text>
  <text x="840" y="600" font-family="Arial, 'Helvetica Neue', 'Microsoft YaHei', sans-serif" font-size="24" fill="#FF5722" font-weight="bold">{{RANK_2_RIGHT}}</text>

  <!-- 金字塔 — 第3层 -->
  <polygon points="441,660 801,660 861,780 381,780" fill="#FF9800"/>
  <text x="621" y="735" text-anchor="middle" font-family="Arial, 'Helvetica Neue', 'Microsoft YaHei', sans-serif" font-size="28" font-weight="bold" fill="#FFFFFF">{{RANK_3}}</text>
  <text x="340" y="730" text-anchor="end" font-family="Arial, 'Helvetica Neue', 'Microsoft YaHei', sans-serif" font-size="24" fill="#333333">{{RANK_3_LEFT}}</text>
  <text x="900" y="730" font-family="Arial, 'Helvetica Neue', 'Microsoft YaHei', sans-serif" font-size="24" fill="#FF9800" font-weight="bold">{{RANK_3_RIGHT}}</text>

  <!-- 金字塔 — 第4层 -->
  <polygon points="381,790 861,790 921,910 321,910" fill="#FFC107"/>
  <text x="621" y="865" text-anchor="middle" font-family="Arial, 'Helvetica Neue', 'Microsoft YaHei', sans-serif" font-size="28" font-weight="bold" fill="#FFFFFF">{{RANK_4}}</text>
  <text x="280" y="860" text-anchor="end" font-family="Arial, 'Helvetica Neue', 'Microsoft YaHei', sans-serif" font-size="24" fill="#333333">{{RANK_4_LEFT}}</text>
  <text x="960" y="860" font-family="Arial, 'Helvetica Neue', 'Microsoft YaHei', sans-serif" font-size="24" fill="#FFC107" font-weight="bold">{{RANK_4_RIGHT}}</text>

  <!-- 金字塔 — 第5层 -->
  <polygon points="321,920 921,920 981,1040 261,1040" fill="#8BC34A"/>
  <text x="621" y="995" text-anchor="middle" font-family="Arial, 'Helvetica Neue', 'Microsoft YaHei', sans-serif" font-size="28" font-weight="bold" fill="#FFFFFF">{{RANK_5}}</text>
  <text x="220" y="990" text-anchor="end" font-family="Arial, 'Helvetica Neue', 'Microsoft YaHei', sans-serif" font-size="24" fill="#333333">{{RANK_5_LEFT}}</text>
  <text x="1020" y="990" font-family="Arial, 'Helvetica Neue', 'Microsoft YaHei', sans-serif" font-size="24" fill="#8BC34A" font-weight="bold">{{RANK_5_RIGHT}}</text>

  <!-- 金字塔 — 第6层（底部，最宽） -->
  <polygon points="261,1050 981,1050 1041,1170 201,1170" fill="#4CAF50"/>
  <text x="621" y="1125" text-anchor="middle" font-family="Arial, 'Helvetica Neue', 'Microsoft YaHei', sans-serif" font-size="28" font-weight="bold" fill="#FFFFFF">{{RANK_6}}</text>
  <text x="160" y="1120" text-anchor="end" font-family="Arial, 'Helvetica Neue', 'Microsoft YaHei', sans-serif" font-size="24" fill="#333333">{{RANK_6_LEFT}}</text>
  <text x="1080" y="1120" font-family="Arial, 'Helvetica Neue', 'Microsoft YaHei', sans-serif" font-size="24" fill="#4CAF50" font-weight="bold">{{RANK_6_RIGHT}}</text>

  <!-- 底部说明区 -->
  <rect x="60" y="1240" width="1122" height="280" rx="16" fill="#FFFFFF"/>
  <text x="100" y="1290" font-family="Arial, 'Helvetica Neue', 'Microsoft YaHei', sans-serif" font-size="28" font-weight="bold" fill="#333333">{{NOTE_TITLE}}</text>
  <rect x="100" y="1310" width="60" height="3" rx="1" fill="#E53935"/>
  <text x="100" y="1360" font-family="Arial, 'Helvetica Neue', 'Microsoft YaHei', sans-serif" font-size="24" fill="#666666">{{NOTE_1}}</text>
  <text x="100" y="1400" font-family="Arial, 'Helvetica Neue', 'Microsoft YaHei', sans-serif" font-size="24" fill="#666666">{{NOTE_2}}</text>
  <text x="100" y="1440" font-family="Arial, 'Helvetica Neue', 'Microsoft YaHei', sans-serif" font-size="24" fill="#666666">{{NOTE_3}}</text>
  <text x="100" y="1480" font-family="Arial, 'Helvetica Neue', 'Microsoft YaHei', sans-serif" font-size="24" fill="#999999">{{DISCLAIMER}}</text>

  <!-- 底部 -->
  <rect x="60" y="1560" width="1122" height="1" fill="#E0E0E0"/>
  <text x="60" y="1600" font-family="Arial, 'Helvetica Neue', 'Microsoft YaHei', sans-serif" font-size="22" fill="#999999">{{AUTHOR}}</text>
  <text x="1182" y="1600" text-anchor="end" font-family="Arial, 'Helvetica Neue', 'Microsoft YaHei', sans-serif" font-size="22" fill="#CCCCCC">{{DATE}}</text>
</svg>
