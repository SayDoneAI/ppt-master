<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080">
  <!-- 背景 -->
  <rect width="1080" height="1080" fill="#F8FAFC"/>

  <!-- 顶部标题区 -->
  <rect x="60" y="60" width="960" height="200" rx="20" fill="#2563EB"/>
  <text x="540" y="140" text-anchor="middle" font-family="Arial, 'Helvetica Neue', 'Microsoft YaHei', sans-serif" font-size="48" font-weight="bold" fill="#FFFFFF">{{TITLE}}</text>
  <text x="540" y="190" text-anchor="middle" font-family="Arial, 'Helvetica Neue', 'Microsoft YaHei', sans-serif" font-size="24" fill="#FFFFFF" fill-opacity="0.8">{{SUBTITLE}}</text>
  <!-- 橙色标签 -->
  <rect x="60" y="220" width="180" height="40" rx="0" fill="#F97316"/>
  <text x="150" y="247" text-anchor="middle" font-family="Arial, 'Helvetica Neue', 'Microsoft YaHei', sans-serif" font-size="20" font-weight="bold" fill="#FFFFFF">{{DATE}}</text>

  <!-- 中间简短描述 -->
  <text x="540" y="330" text-anchor="middle" font-family="Arial, 'Helvetica Neue', 'Microsoft YaHei', sans-serif" font-size="24" fill="#1E293B">{{BODY}}</text>
  <text x="540" y="370" text-anchor="middle" font-family="Arial, 'Helvetica Neue', 'Microsoft YaHei', sans-serif" font-size="22" fill="#64748B">精彩活动不容错过</text>

  <!-- 底部大图区 -->
  <rect x="60" y="420" width="960" height="500" rx="20" fill="#E2E8F0"/>
  <text x="540" y="680" text-anchor="middle" font-family="Arial, 'Helvetica Neue', 'Microsoft YaHei', sans-serif" font-size="28" fill="#94A3B8">{{IMAGE}}</text>

  <!-- CTA + 二维码 -->
  <rect x="60" y="950" width="580" height="64" rx="32" fill="#F97316"/>
  <text x="350" y="990" text-anchor="middle" font-family="Arial, 'Helvetica Neue', 'Microsoft YaHei', sans-serif" font-size="26" font-weight="bold" fill="#FFFFFF">{{CTA}}</text>

  <rect x="700" y="940" width="80" height="80" rx="8" fill="#F1F5F9" stroke="#E2E8F0" stroke-width="1"/>
  <text x="740" y="988" text-anchor="middle" font-family="Arial, 'Helvetica Neue', 'Microsoft YaHei', sans-serif" font-size="12" fill="#94A3B8">{{QR_CODE}}</text>
  <text x="820" y="988" font-family="Arial, 'Helvetica Neue', 'Microsoft YaHei', sans-serif" font-size="16" fill="#64748B">扫码报名</text>

  <!-- 品牌 -->
  <text x="1020" y="1050" text-anchor="end" font-family="Arial, 'Helvetica Neue', 'Microsoft YaHei', sans-serif" font-size="16" fill="#94A3B8">{{AUTHOR}}</text>
</svg>
