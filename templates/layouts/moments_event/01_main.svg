<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080">
  <!-- 背景 -->
  <rect width="1080" height="1080" fill="#F8FAFC"/>

  <!-- 顶部蓝色色块 -->
  <rect x="0" y="0" width="1080" height="480" fill="#2563EB"/>

  <!-- 紫色装饰块 -->
  <rect x="780" y="0" width="300" height="200" fill="#7C3AED"/>

  <!-- 活动标题 -->
  <text x="60" y="200" font-family="Arial, 'Helvetica Neue', 'Microsoft YaHei', sans-serif" font-size="56" font-weight="bold" fill="#FFFFFF">{{TITLE}}</text>
  <text x="60" y="260" font-family="Arial, 'Helvetica Neue', 'Microsoft YaHei', sans-serif" font-size="28" fill="#FFFFFF" fill-opacity="0.85">{{SUBTITLE}}</text>

  <!-- 日期标签 -->
  <rect x="60" y="320" width="260" height="48" rx="24" fill="#FFFFFF" fill-opacity="0.2"/>
  <text x="190" y="352" text-anchor="middle" font-family="Arial, 'Helvetica Neue', 'Microsoft YaHei', sans-serif" font-size="22" fill="#FFFFFF">{{DATE}}</text>

  <!-- 橙色CTA块 -->
  <rect x="60" y="420" width="300" height="56" rx="28" fill="#F97316"/>
  <text x="210" y="456" text-anchor="middle" font-family="Arial, 'Helvetica Neue', 'Microsoft YaHei', sans-serif" font-size="26" font-weight="bold" fill="#FFFFFF">{{CTA}}</text>

  <!-- 中间内容区 -->
  <rect x="60" y="520" width="620" height="240" rx="16" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
  <text x="80" y="570" font-family="Arial, 'Helvetica Neue', 'Microsoft YaHei', sans-serif" font-size="26" font-weight="bold" fill="#1E293B">活动亮点</text>
  <text x="80" y="620" font-family="Arial, 'Helvetica Neue', 'Microsoft YaHei', sans-serif" font-size="22" fill="#64748B">{{BODY}}</text>
  <text x="80" y="660" font-family="Arial, 'Helvetica Neue', 'Microsoft YaHei', sans-serif" font-size="22" fill="#64748B">更多精彩内容等你发现</text>
  <text x="80" y="700" font-family="Arial, 'Helvetica Neue', 'Microsoft YaHei', sans-serif" font-size="22" fill="#64748B">不容错过的限时活动</text>

  <!-- 右侧二维码区 -->
  <rect x="720" y="520" width="300" height="240" rx="16" fill="#F1F5F9"/>
  <rect x="790" y="560" width="160" height="160" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
  <text x="870" y="650" text-anchor="middle" font-family="Arial, 'Helvetica Neue', 'Microsoft YaHei', sans-serif" font-size="16" fill="#94A3B8">{{QR_CODE}}</text>

  <!-- 底部信息区 -->
  <rect x="60" y="800" width="480" height="140" rx="16" fill="#7C3AED" fill-opacity="0.08"/>
  <text x="80" y="850" font-family="Arial, 'Helvetica Neue', 'Microsoft YaHei', sans-serif" font-size="24" font-weight="bold" fill="#7C3AED">限时优惠</text>
  <text x="80" y="890" font-family="Arial, 'Helvetica Neue', 'Microsoft YaHei', sans-serif" font-size="20" fill="#64748B">活动详情请扫描二维码了解</text>

  <rect x="580" y="800" width="440" height="140" rx="16" fill="#F97316" fill-opacity="0.08"/>
  <text x="600" y="850" font-family="Arial, 'Helvetica Neue', 'Microsoft YaHei', sans-serif" font-size="24" font-weight="bold" fill="#F97316">特别福利</text>
  <text x="600" y="890" font-family="Arial, 'Helvetica Neue', 'Microsoft YaHei', sans-serif" font-size="20" fill="#64748B">前100名参与者专享</text>

  <!-- 底部品牌 -->
  <text x="540" y="1020" text-anchor="middle" font-family="Arial, 'Helvetica Neue', 'Microsoft YaHei', sans-serif" font-size="18" fill="#94A3B8">{{AUTHOR}}</text>
</svg>
