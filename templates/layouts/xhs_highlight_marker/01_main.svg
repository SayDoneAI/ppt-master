<svg xmlns="http://www.w3.org/2000/svg" width="1242" height="1660" viewBox="0 0 1242 1660">
  <!-- 米色/牛皮纸背景 -->
  <rect width="1242" height="1660" fill="#FDF6EC"/>

  <!-- 纸张纹理效果 — 细密点 -->
  <rect x="0" y="0" width="1242" height="1660" fill="#000000" fill-opacity="0.015"/>

  <!-- 大标题（手写风格 — 用粗体大字模拟） -->
  <text x="621" y="280" text-anchor="middle" font-family="'STKaiti', 'KaiTi', 'Noto Serif CJK SC', serif" font-size="96" font-weight="bold" fill="#1A1A1A">{{TITLE_LINE1}}</text>
  <text x="621" y="400" text-anchor="middle" font-family="'STKaiti', 'KaiTi', 'Noto Serif CJK SC', serif" font-size="96" font-weight="bold" fill="#1A1A1A">{{TITLE_LINE2}}</text>

  <!-- 荧光笔高亮 — 关键词背景（黄色荧光笔效果） -->
  <rect x="180" y="430" width="880" height="110" rx="4" fill="#FFEB3B" fill-opacity="0.7"/>
  <!-- 高亮文字 -->
  <text x="621" y="520" text-anchor="middle" font-family="'STKaiti', 'KaiTi', 'Noto Serif CJK SC', serif" font-size="96" font-weight="bold" fill="#E53935">{{HIGHLIGHT_WORD}}</text>

  <!-- 副标题 -->
  <text x="621" y="650" text-anchor="middle" font-family="'STKaiti', 'KaiTi', 'Noto Serif CJK SC', serif" font-size="80" font-weight="bold" fill="#1A1A1A">{{TITLE_LINE3}}</text>

  <!-- 感叹号装饰 -->
  <text x="1000" y="680" font-family="'STKaiti', 'KaiTi', 'Noto Serif CJK SC', serif" font-size="96" font-weight="bold" fill="#E53935">!!</text>

  <!-- 分割线 -->
  <rect x="200" y="740" width="842" height="3" fill="#D4C5A9"/>

  <!-- 正文要点区域 -->
  <text x="120" y="830" font-family="'STKaiti', 'KaiTi', 'Noto Serif CJK SC', serif" font-size="36" font-weight="bold" fill="#333333">{{POINT_1_TITLE}}</text>
  <!-- 要点1高亮 -->
  <rect x="108" y="850" width="1020" height="50" rx="2" fill="#FFEB3B" fill-opacity="0.3"/>
  <text x="120" y="888" font-family="Arial, 'Helvetica Neue', 'Microsoft YaHei', sans-serif" font-size="28" fill="#555555">{{POINT_1_DESC}}</text>

  <text x="120" y="970" font-family="'STKaiti', 'KaiTi', 'Noto Serif CJK SC', serif" font-size="36" font-weight="bold" fill="#333333">{{POINT_2_TITLE}}</text>
  <rect x="108" y="990" width="1020" height="50" rx="2" fill="#FFEB3B" fill-opacity="0.3"/>
  <text x="120" y="1028" font-family="Arial, 'Helvetica Neue', 'Microsoft YaHei', sans-serif" font-size="28" fill="#555555">{{POINT_2_DESC}}</text>

  <text x="120" y="1110" font-family="'STKaiti', 'KaiTi', 'Noto Serif CJK SC', serif" font-size="36" font-weight="bold" fill="#333333">{{POINT_3_TITLE}}</text>
  <rect x="108" y="1130" width="1020" height="50" rx="2" fill="#FFEB3B" fill-opacity="0.3"/>
  <text x="120" y="1168" font-family="Arial, 'Helvetica Neue', 'Microsoft YaHei', sans-serif" font-size="28" fill="#555555">{{POINT_3_DESC}}</text>

  <text x="120" y="1250" font-family="'STKaiti', 'KaiTi', 'Noto Serif CJK SC', serif" font-size="36" font-weight="bold" fill="#333333">{{POINT_4_TITLE}}</text>
  <rect x="108" y="1270" width="1020" height="50" rx="2" fill="#FFEB3B" fill-opacity="0.3"/>
  <text x="120" y="1308" font-family="Arial, 'Helvetica Neue', 'Microsoft YaHei', sans-serif" font-size="28" fill="#555555">{{POINT_4_DESC}}</text>

  <!-- 底部建议框 -->
  <rect x="100" y="1390" width="1042" height="140" rx="12" fill="#FFFFFF"/>
  <rect x="100" y="1390" width="8" height="140" rx="4" fill="#E53935"/>
  <text x="140" y="1440" font-family="'STKaiti', 'KaiTi', 'Noto Serif CJK SC', serif" font-size="32" font-weight="bold" fill="#E53935">{{CTA_TITLE}}</text>
  <text x="140" y="1495" font-family="Arial, 'Helvetica Neue', 'Microsoft YaHei', sans-serif" font-size="26" fill="#666666">{{CTA_DESC}}</text>

  <!-- 底部 -->
  <rect x="100" y="1570" width="1042" height="1" fill="#D4C5A9"/>
  <text x="100" y="1610" font-family="Arial, 'Helvetica Neue', 'Microsoft YaHei', sans-serif" font-size="22" fill="#999999">{{AUTHOR}}</text>
  <text x="1142" y="1610" text-anchor="end" font-family="Arial, 'Helvetica Neue', 'Microsoft YaHei', sans-serif" font-size="22" fill="#CCCCCC">{{DATE}}</text>
</svg>
