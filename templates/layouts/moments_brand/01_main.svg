<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E1B4B"/>
      <stop offset="50%" stop-color="#312E81"/>
      <stop offset="100%" stop-color="#4C1D95"/>
    </linearGradient>
  </defs>

  <!-- 渐变背景 -->
  <rect width="1080" height="1080" fill="url(#bgGrad)"/>

  <!-- 装饰光效圆 -->
  <circle cx="200" cy="200" r="200" fill="#6366F1" fill-opacity="0.15"/>
  <circle cx="900" cy="400" r="150" fill="#EC4899" fill-opacity="0.1"/>
  <circle cx="500" cy="900" r="180" fill="#8B5CF6" fill-opacity="0.12"/>

  <!-- 毛玻璃卡片 -->
  <rect x="80" y="280" width="920" height="520" rx="24" fill="#FFFFFF" fill-opacity="0.1" stroke="#FFFFFF" stroke-opacity="0.2" stroke-width="1"/>

  <!-- 品牌标题 -->
  <text x="540" y="180" text-anchor="middle" font-family="Arial, 'Helvetica Neue', 'Microsoft YaHei', sans-serif" font-size="20" fill="#FFFFFF" fill-opacity="0.5">{{AUTHOR}}</text>

  <text x="540" y="420" text-anchor="middle" font-family="Arial, 'Helvetica Neue', 'Microsoft YaHei', sans-serif" font-size="56" font-weight="bold" fill="#FFFFFF">{{TITLE}}</text>
  <text x="540" y="480" text-anchor="middle" font-family="Arial, 'Helvetica Neue', 'Microsoft YaHei', sans-serif" font-size="28" fill="#FFFFFF" fill-opacity="0.7">{{SUBTITLE}}</text>

  <!-- 分割线 -->
  <rect x="440" y="520" width="200" height="1" fill="#FFFFFF" fill-opacity="0.3"/>

  <!-- 正文 -->
  <text x="540" y="590" text-anchor="middle" font-family="Arial, 'Helvetica Neue', 'Microsoft YaHei', sans-serif" font-size="22" fill="#FFFFFF" fill-opacity="0.8">{{BODY}}</text>
  <text x="540" y="630" text-anchor="middle" font-family="Arial, 'Helvetica Neue', 'Microsoft YaHei', sans-serif" font-size="22" fill="#FFFFFF" fill-opacity="0.8">品质生活，从这里开始</text>

  <!-- CTA 按钮 -->
  <rect x="380" y="700" width="320" height="56" rx="28" fill="#FFFFFF" fill-opacity="0.15" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="1"/>
  <text x="540" y="736" text-anchor="middle" font-family="Arial, 'Helvetica Neue', 'Microsoft YaHei', sans-serif" font-size="22" fill="#FFFFFF">{{CTA}}</text>

  <!-- 底部二维码区 -->
  <rect x="440" y="880" width="200" height="120" rx="12" fill="#FFFFFF" fill-opacity="0.08"/>
  <rect x="470" y="890" width="80" height="80" rx="4" fill="#FFFFFF" fill-opacity="0.15"/>
  <text x="510" y="940" text-anchor="middle" font-family="Arial, 'Helvetica Neue', 'Microsoft YaHei', sans-serif" font-size="12" fill="#FFFFFF" fill-opacity="0.4">{{QR_CODE}}</text>
  <text x="580" y="930" font-family="Arial, 'Helvetica Neue', 'Microsoft YaHei', sans-serif" font-size="14" fill="#FFFFFF" fill-opacity="0.5">扫码</text>
  <text x="580" y="955" font-family="Arial, 'Helvetica Neue', 'Microsoft YaHei', sans-serif" font-size="14" fill="#FFFFFF" fill-opacity="0.5">了解更多</text>

  <!-- 底部日期 -->
  <text x="540" y="1050" text-anchor="middle" font-family="Arial, 'Helvetica Neue', 'Microsoft YaHei', sans-serif" font-size="16" fill="#FFFFFF" fill-opacity="0.3">{{DATE}}</text>
</svg>
