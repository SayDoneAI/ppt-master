<svg xmlns="http://www.w3.org/2000/svg" width="1242" height="1660" viewBox="0 0 1242 1660">
  <!-- 纯黑背景 - 反转版 -->
  <rect width="1242" height="1660" fill="#111111"/>

  <!-- 顶部装饰线 -->
  <rect x="80" y="120" width="120" height="6" fill="#FFFFFF"/>

  <!-- 超大金句 -->
  <text x="621" y="580" text-anchor="middle" font-family="Arial, 'Helvetica Neue', 'Microsoft YaHei', sans-serif" font-size="80" font-weight="900" fill="#FFFFFF">{{TITLE}}</text>

  <!-- 副标题 -->
  <text x="621" y="700" text-anchor="middle" font-family="Arial, 'Helvetica Neue', 'Microsoft YaHei', sans-serif" font-size="28" fill="#666666">{{SUBTITLE}}</text>

  <!-- 分割线 -->
  <rect x="541" y="780" width="160" height="2" fill="#FFFFFF"/>

  <!-- 正文 -->
  <text x="621" y="880" text-anchor="middle" font-family="Arial, 'Helvetica Neue', 'Microsoft YaHei', sans-serif" font-size="26" fill="#AAAAAA">{{BODY}}</text>
  <text x="621" y="930" text-anchor="middle" font-family="Arial, 'Helvetica Neue', 'Microsoft YaHei', sans-serif" font-size="26" fill="#AAAAAA">深夜思考与自我对话</text>

  <!-- 底部装饰块 -->
  <rect x="80" y="1400" width="1082" height="120" rx="0" fill="#1A1A1A"/>
  <text x="621" y="1450" text-anchor="middle" font-family="Arial, 'Helvetica Neue', 'Microsoft YaHei', sans-serif" font-size="24" fill="#FFFFFF">{{AUTHOR}}</text>
  <text x="621" y="1490" text-anchor="middle" font-family="Arial, 'Helvetica Neue', 'Microsoft YaHei', sans-serif" font-size="18" fill="#666666">{{DATE}}</text>

  <!-- 底部装饰线 -->
  <rect x="1042" y="1534" width="120" height="6" fill="#FFFFFF"/>
</svg>
