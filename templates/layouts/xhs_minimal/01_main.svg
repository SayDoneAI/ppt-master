<svg xmlns="http://www.w3.org/2000/svg" width="1242" height="1660" viewBox="0 0 1242 1660">
  <!-- 纯白背景 -->
  <rect width="1242" height="1660" fill="#FFFFFF"/>

  <!-- 顶部装饰线 -->
  <rect x="80" y="120" width="120" height="6" fill="#000000"/>

  <!-- 超大金句 - 居中 -->
  <text x="621" y="580" text-anchor="middle" font-family="Arial, 'Helvetica Neue', 'Microsoft YaHei', sans-serif" font-size="80" font-weight="900" fill="#000000">{{TITLE}}</text>

  <!-- 副标题 -->
  <text x="621" y="700" text-anchor="middle" font-family="Arial, 'Helvetica Neue', 'Microsoft YaHei', sans-serif" font-size="28" fill="#999999">{{SUBTITLE}}</text>

  <!-- 分割线 -->
  <rect x="541" y="780" width="160" height="2" fill="#000000"/>

  <!-- 正文区 -->
  <text x="621" y="880" text-anchor="middle" font-family="Arial, 'Helvetica Neue', 'Microsoft YaHei', sans-serif" font-size="26" fill="#333333">{{BODY}}</text>
  <text x="621" y="930" text-anchor="middle" font-family="Arial, 'Helvetica Neue', 'Microsoft YaHei', sans-serif" font-size="26" fill="#333333">延伸思考与深度解读</text>

  <!-- 底部装饰块 -->
  <rect x="80" y="1400" width="1082" height="120" rx="0" fill="#F5F5F5"/>
  <text x="621" y="1450" text-anchor="middle" font-family="Arial, 'Helvetica Neue', 'Microsoft YaHei', sans-serif" font-size="24" fill="#000000">{{AUTHOR}}</text>
  <text x="621" y="1490" text-anchor="middle" font-family="Arial, 'Helvetica Neue', 'Microsoft YaHei', sans-serif" font-size="18" fill="#999999">{{DATE}}</text>

  <!-- 底部装饰线 -->
  <rect x="1042" y="1534" width="120" height="6" fill="#000000"/>
</svg>
