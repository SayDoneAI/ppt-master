<svg xmlns="http://www.w3.org/2000/svg" width="1242" height="1660" viewBox="0 0 1242 1660">
  <!-- 深色背景 -->
  <rect width="1242" height="1660" fill="#0D1117"/>

  <!-- 顶部装饰条 -->
  <rect x="0" y="0" width="1242" height="8" fill="#F5A623"/>

  <!-- 顶部标签 -->
  <rect x="60" y="60" width="200" height="48" rx="24" fill="#F5A623"/>
  <text x="160" y="92" text-anchor="middle" font-family="Arial, 'Helvetica Neue', 'Microsoft YaHei', sans-serif" font-size="24" font-weight="bold" fill="#0D1117">{{TAG}}</text>

  <!-- 大标题 -->
  <text x="621" y="220" text-anchor="middle" font-family="Arial, 'Helvetica Neue', 'Microsoft YaHei', sans-serif" font-size="72" font-weight="bold" fill="#FFFFFF">{{TITLE}}</text>

  <!-- 核心大数字区域 -->
  <rect x="100" y="300" width="1042" height="360" rx="24" fill="#161B22"/>

  <!-- 主数字 -->
  <text x="621" y="460" text-anchor="middle" font-family="Arial, 'Helvetica Neue', 'Microsoft YaHei', sans-serif" font-size="160" font-weight="bold" fill="#F5A623">{{BIG_NUMBER}}</text>
  <text x="621" y="530" text-anchor="middle" font-family="Arial, 'Helvetica Neue', 'Microsoft YaHei', sans-serif" font-size="36" fill="#8B949E">{{BIG_NUMBER_LABEL}}</text>
  <!-- 数字单位/后缀 -->
  <text x="621" y="590" text-anchor="middle" font-family="Arial, 'Helvetica Neue', 'Microsoft YaHei', sans-serif" font-size="28" fill="#58A6FF">{{BIG_NUMBER_NOTE}}</text>

  <!-- 三列数据卡片 -->
  <rect x="60" y="710" width="354" height="200" rx="16" fill="#161B22"/>
  <text x="237" y="790" text-anchor="middle" font-family="Arial, 'Helvetica Neue', 'Microsoft YaHei', sans-serif" font-size="56" font-weight="bold" fill="#58A6FF">{{STAT_1_VALUE}}</text>
  <text x="237" y="845" text-anchor="middle" font-family="Arial, 'Helvetica Neue', 'Microsoft YaHei', sans-serif" font-size="24" fill="#8B949E">{{STAT_1_LABEL}}</text>

  <rect x="434" y="710" width="374" height="200" rx="16" fill="#161B22"/>
  <text x="621" y="790" text-anchor="middle" font-family="Arial, 'Helvetica Neue', 'Microsoft YaHei', sans-serif" font-size="56" font-weight="bold" fill="#F5A623">{{STAT_2_VALUE}}</text>
  <text x="621" y="845" text-anchor="middle" font-family="Arial, 'Helvetica Neue', 'Microsoft YaHei', sans-serif" font-size="24" fill="#8B949E">{{STAT_2_LABEL}}</text>

  <rect x="828" y="710" width="354" height="200" rx="16" fill="#161B22"/>
  <text x="1005" y="790" text-anchor="middle" font-family="Arial, 'Helvetica Neue', 'Microsoft YaHei', sans-serif" font-size="56" font-weight="bold" fill="#3FB950">{{STAT_3_VALUE}}</text>
  <text x="1005" y="845" text-anchor="middle" font-family="Arial, 'Helvetica Neue', 'Microsoft YaHei', sans-serif" font-size="24" fill="#8B949E">{{STAT_3_LABEL}}</text>

  <!-- 说明文字区域 -->
  <rect x="60" y="960" width="1122" height="480" rx="16" fill="#161B22"/>
  <text x="100" y="1020" font-family="Arial, 'Helvetica Neue', 'Microsoft YaHei', sans-serif" font-size="32" font-weight="bold" fill="#FFFFFF">{{DETAIL_TITLE}}</text>
  <rect x="100" y="1040" width="60" height="4" rx="2" fill="#F5A623"/>

  <text x="140" y="1100" font-family="Arial, 'Helvetica Neue', 'Microsoft YaHei', sans-serif" font-size="26" fill="#C9D1D9">{{DETAIL_1}}</text>
  <text x="100" y="1100" font-family="Arial, 'Helvetica Neue', 'Microsoft YaHei', sans-serif" font-size="26" fill="#F5A623">●</text>
  <text x="140" y="1160" font-family="Arial, 'Helvetica Neue', 'Microsoft YaHei', sans-serif" font-size="26" fill="#C9D1D9">{{DETAIL_2}}</text>
  <text x="100" y="1160" font-family="Arial, 'Helvetica Neue', 'Microsoft YaHei', sans-serif" font-size="26" fill="#F5A623">●</text>
  <text x="140" y="1220" font-family="Arial, 'Helvetica Neue', 'Microsoft YaHei', sans-serif" font-size="26" fill="#C9D1D9">{{DETAIL_3}}</text>
  <text x="100" y="1220" font-family="Arial, 'Helvetica Neue', 'Microsoft YaHei', sans-serif" font-size="26" fill="#F5A623">●</text>
  <text x="140" y="1280" font-family="Arial, 'Helvetica Neue', 'Microsoft YaHei', sans-serif" font-size="26" fill="#C9D1D9">{{DETAIL_4}}</text>
  <text x="100" y="1280" font-family="Arial, 'Helvetica Neue', 'Microsoft YaHei', sans-serif" font-size="26" fill="#F5A623">●</text>
  <text x="140" y="1340" font-family="Arial, 'Helvetica Neue', 'Microsoft YaHei', sans-serif" font-size="26" fill="#C9D1D9">{{DETAIL_5}}</text>
  <text x="100" y="1340" font-family="Arial, 'Helvetica Neue', 'Microsoft YaHei', sans-serif" font-size="26" fill="#F5A623">●</text>

  <!-- CTA -->
  <rect x="371" y="1490" width="500" height="64" rx="32" fill="#F5A623"/>
  <text x="621" y="1532" text-anchor="middle" font-family="Arial, 'Helvetica Neue', 'Microsoft YaHei', sans-serif" font-size="28" font-weight="bold" fill="#0D1117">{{CTA}}</text>

  <!-- 底部信息 -->
  <text x="60" y="1620" font-family="Arial, 'Helvetica Neue', 'Microsoft YaHei', sans-serif" font-size="22" fill="#484F58">{{AUTHOR}}</text>
  <text x="1182" y="1620" text-anchor="end" font-family="Arial, 'Helvetica Neue', 'Microsoft YaHei', sans-serif" font-size="22" fill="#484F58">{{DATE}}</text>
</svg>
